# SDPivot OP frontend: one user SPA entry plus API proxy.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # A deployment may mount a read-only server-context TLS snippet here.
    include /etc/nginx/tls/*.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Compatibility for the current image health check; new deployments use /healthz.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # OP images must never expose the legacy operations SPA.
    location = /ops.html { return 404; }
    location = /ops { return 404; }
    location ^~ /ops/ { return 404; }
    location = /ops-login { return 404; }
    location ^~ /ops-login/ { return 404; }

    # Refuse dotfiles and dot-directories. The OP frontend has no .well-known contract.
    location ~ (^|/)\. { return 404; }

    # Preserve request URIs. Canonical and legacy SDPivot APIs use the dedicated
    # backend; all other WeKnora APIs use the main app backend.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location = /api { return 404; }

    location = /api/v1/sdp {
        proxy_pass http://sdp-backend:8081;
    }

    location ^~ /api/v1/sdp/ {
        proxy_pass http://sdp-backend:8081;
    }

    location = /api/v1/smartknora {
        proxy_pass http://sdp-backend:8081;
    }

    location ^~ /api/v1/smartknora/ {
        proxy_pass http://sdp-backend:8081;
    }

    location ^~ /api/ {
        proxy_pass http://app:8080;
    }

    # Vite emits content-hashed bundles below /assets/. Missing bundles fail closed.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    }

    # Files outside /assets are mutable and receive only conservative caching.
    location ~* \.(?:css|js|json|map|svg|png|jpe?g|gif|webp|ico|woff2?|ttf|otf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    }

    # Only normal user routes may fall back to the single OP index.
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        rewrite ^ /index.html break;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    }
}
