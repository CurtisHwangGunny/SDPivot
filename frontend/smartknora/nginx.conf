# smartKnora Frontend Nginx Config (SPA mode)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # API proxy to smartKnora backend
    location /api/ {
        proxy_pass http://smartknora-backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ops admin SPA fallback — MUST come before the generic / location
    location /ops {
        try_files $uri /ops.html;
    }

    # Ops login page
    location /ops-login {
        try_files $uri /ops.html;
    }

    # SPA fallback (user app)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset cache
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
