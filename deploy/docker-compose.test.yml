# SDPivot Docker Compose - Test Environment
# Requires the WeKnora Docker network and backing services to be running.

services:
  sdp-backend:
    build:
      context: ../frontend/sdpivot
      dockerfile: Dockerfile.backend
    image: sdp-backend:test
    container_name: sdp-backend
    restart: unless-stopped
    ports:
      - "${SDP_BACKEND_PORT:-8082}:8081"
    environment:
      SMART_DB_HOST: ${SMART_DB_HOST:-WeKnora-postgres}
      SMART_DB_PORT: ${SMART_DB_PORT:-5432}
      SMART_DB_NAME: ${SMART_DB_NAME:-WeKnora}
      SMART_DB_USER: ${SMART_DB_USER:-postgres}
      SMART_DB_PASSWORD: ${SMART_DB_PASSWORD:?SMART_DB_PASSWORD is required}
      REDIS_ADDR: ${REDIS_ADDR:-WeKnora-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      UPLOAD_DIR: /tmp/sdp-uploads
      SDP_JWT_SECRET: ${SDP_JWT_SECRET:?SDP_JWT_SECRET is required}
      SDP_ALLOWED_ORIGINS: ${SDP_ALLOWED_ORIGINS:-}
      GIN_MODE: release
    volumes:
      - "${SDP_UPLOAD_DIR:-/tmp/sdp-uploads}:/tmp/sdp-uploads"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - weknora_WeKnora-network

  sdp-frontend:
    build:
      context: ../frontend/sdpivot
      dockerfile: Dockerfile.frontend
    image: sdp-frontend:test
    container_name: sdp-frontend
    restart: unless-stopped
    ports:
      - "${SDP_FRONTEND_PORT:-3099}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - weknora_WeKnora-network
    depends_on:
      - sdp-backend

networks:
  weknora_WeKnora-network:
    external: true
