# SDPivot Docker Compose - Test Environment
# Requires the WeKnora Docker network and backing services to be running.

services:
  sdp-backend:
    build:
      context: ../frontend/sdpivot
      dockerfile: Dockerfile.backend
    image: sdp-backend:test
    container_name: sdp-backend
    restart: unless-stopped
    ports:
      - "${SDP_BACKEND_PORT:-8082}:8081"
    environment:
      SDP_DB_HOST: ${SDP_DB_HOST:-WeKnora-postgres}
      SDP_DB_PORT: ${SDP_DB_PORT:-5432}
      SDP_DB_NAME: ${SDP_DB_NAME:-WeKnora}
      SDP_DB_USER: ${SDP_DB_USER:-postgres}
      SDP_DB_PASSWORD: ${SDP_DB_PASSWORD:?SDP_DB_PASSWORD is required}
      SDP_REDIS_ADDR: ${SDP_REDIS_ADDR:-WeKnora-redis:6379}
      SDP_REDIS_PASSWORD: ${SDP_REDIS_PASSWORD:-}
      SDP_UPLOAD_DIR: /tmp/sdpivot-uploads
      SDP_JWT_SECRET: ${SDP_JWT_SECRET:?SDP_JWT_SECRET is required}
      SDP_ALLOWED_ORIGINS: ${SDP_ALLOWED_ORIGINS:-}
      SYSTEM_AES_KEY: ${SDP_SYSTEM_AES_KEY:-}
      GIN_MODE: release
    volumes:
      - op-sdp-files:/tmp/sdpivot-uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - weknora_WeKnora-network

  sdp-frontend:
    build:
      context: ../frontend/sdpivot
      dockerfile: Dockerfile.frontend
    image: sdp-frontend:test
    container_name: sdp-frontend
    restart: unless-stopped
    ports:
      - "${SDP_FRONTEND_PORT:-3099}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - weknora_WeKnora-network
    depends_on:
      sdp-backend:
        condition: service_healthy

volumes:
  op-sdp-files:
    external: true

networks:
  weknora_WeKnora-network:
    external: true
